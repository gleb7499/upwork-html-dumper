<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 260px;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #f7f8fa;
      color: #1f2328;
    }
    .header {
      background: #14a800;
      color: #fff;
      padding: 12px 14px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }
    .body {
      padding: 14px;
    }
    .buttons {
      display: flex;
      gap: 8px;
    }
    button {
      flex: 1;
      padding: 9px 0;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }
    #startBtn {
      background: #14a800;
      color: #fff;
    }
    #startBtn:hover:not(:disabled) {
      background: #108a00;
    }
    #stopBtn {
      background: #d93025;
      color: #fff;
    }
    #stopBtn:hover:not(:disabled) {
      background: #b3261e;
    }
    button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    #dumpBtn {
      width: 100%;
      margin-top: 8px;
      background: #1a73e8;
      color: #fff;
    }
    #dumpBtn:hover:not(:disabled) {
      background: #1557b0;
    }
    .progress-wrap {
      margin-top: 14px;
    }
    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #5f6368;
      margin-bottom: 6px;
    }
    .progress-bar {
      height: 6px;
      background: #e2e5e9;
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: #14a800;
      border-radius: 3px;
      transition: width 0.4s ease;
    }
    .status-row {
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #5f6368;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #9a9a9a;
      flex-shrink: 0;
    }
    .status-dot.running {
      background: #14a800;
      animation: pulse 1.2s ease-in-out infinite;
    }
    .status-dot.done {
      background: #1a73e8;
    }
    .status-dot.error {
      background: #d93025;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>
  <div class="header">Upwork HTML Dumper</div>
  <div class="body">
    <div class="buttons">
      <button id="startBtn">Start</button>
      <button id="stopBtn" disabled>Stop</button>
    </div>
    <button id="dumpBtn">Dump this page</button>
    <div class="progress-wrap">
      <div class="progress-info">
        <span>Progress</span>
        <span id="progress">- / -</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>
    <div class="status-row">
      <span class="status-dot" id="statusDot"></span>
      <span id="status">Waiting...</span>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
